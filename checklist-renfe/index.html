<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Turno Betanzos-Infesta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg:           #0e0e0e;
    --bg2:          #161616;
    --bg3:          #1e1e1e;
    --border:       #2a2a2a;
    --border2:      #383838;
    --renfe-red:    #cc0000;
    --renfe-red2:   #e60000;
    --renfe-silver: #c8c8c8;
    --renfe-gold:   #d4a017;
    --text:         #efefef;
    --muted:        #767676;
    --green:        #3dba6e;
    --amber:        #d4a017;
    --blue-soft:    #6fa3d4;
    --purple-soft:  #9b7fd4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ── MODO DÍA ── */
  body.day {
    --bg:     #f0f0f0;
    --bg2:    #ffffff;
    --bg3:    #e4e4e4;
    --border: #cccccc;
    --border2:#b8b8b8;
    --text:   #1a1a1a;
    --muted:  #636363;
  }
  body.day .task:active { background: #d4d4d4; }
  body.day .nav-btn:active { background: #d0d0d0; }
  body.day .wa-block { background: rgba(0,120,60,0.06); border-color: rgba(0,120,60,0.22); }
  body.day .wa-text { color: #1a7a3a; }
  body.day .copy-btn { color: #1a7a3a; border-color: rgba(0,120,60,0.35); background: rgba(0,120,60,0.08); }
  body.day .copy-btn:active, body.day .copy-btn.copied { background: rgba(0,120,60,0.22); color: #fff; }
  body.day .turno-alert { background: rgba(0,0,0,0.45); }
  body.day .tab-viaje { color: #2a2a2a; }
  body.day .tab.active .tab-viaje { color: var(--renfe-red); }
  body.day .tab-dir { color: #3a6a9a; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    flex-shrink: 0;
    background: var(--bg2);
    border-bottom: 3px solid var(--renfe-red);
    padding: 0;
  }

  .header-inner {
    display: flex;
    align-items: stretch;
    height: 54px;
  }

  .renfe-stripe {
    width: 6px;
    background: var(--renfe-red);
    flex-shrink: 0;
  }

  .header-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    gap: 10px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .renfe-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--renfe-red2);
    text-transform: uppercase;
    border: 2px solid var(--renfe-red);
    padding: 2px 7px;
    border-radius: 2px;
    line-height: 1;
  }

  .header-station {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--renfe-silver);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-btn, .log-btn {
    background: none;
    border: none;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    opacity: 0.65;
    transition: opacity 0.15s;
  }
  .theme-btn:active, .log-btn:active { opacity: 1; }

  .clock {
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--renfe-gold);
    letter-spacing: 0.08em;
    text-align: right;
  }

  .tab-ops {
    font-size: 0.62rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 14px 7px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }

  .progress-bar-wrap {
    flex: 1;
    background: var(--border);
    border-radius: 2px;
    height: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--renfe-red), var(--renfe-gold));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  /* ── BANNER INICIO TURNO ── */
  .turno-banner {
    flex-shrink: 0;
    background: rgba(212,160,23,0.1);
    border-bottom: 1px solid rgba(212,160,23,0.35);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .turno-banner-text {
    font-size: 0.78rem;
    color: var(--renfe-gold);
    line-height: 1.4;
  }
  .turno-banner-btn {
    flex-shrink: 0;
    background: rgba(212,160,23,0.18);
    border: 1px solid rgba(212,160,23,0.5);
    color: var(--renfe-gold);
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .turno-banner-btn:active { background: rgba(212,160,23,0.35); }

  /* ── ALERTA FIN TURNO ── */
  .turno-alert {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 24px;
  }
  .turno-alert-box {
    background: var(--bg2);
    border: 2px solid var(--renfe-red);
    border-radius: 4px;
    padding: 28px 22px 22px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .turno-alert-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .turno-alert-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .turno-alert-msg {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 22px;
    line-height: 1.55;
  }
  .turno-alert-btn {
    background: var(--renfe-red);
    border: none;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px;
    border-radius: 2px;
    cursor: pointer;
    width: 100%;
  }
  .turno-alert-btn:active { background: var(--renfe-red2); }

  /* ── TABS ── */
  .tabs-wrap {
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tabs { display: flex; padding: 6px 8px; gap: 4px; width: max-content; }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 7px 13px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    min-width: 84px;
    background: var(--bg3);
    font-family: 'Oswald', sans-serif;
    position: relative;
  }
  .tab:active { opacity: 0.75; }

  .tab.active {
    background: var(--bg);
    border-color: var(--renfe-red);
    border-bottom: 2px solid var(--renfe-red);
  }

  .tab-viaje {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--renfe-silver);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .tab.active .tab-viaje { color: #fff; }

  .tab-horario {
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 400;
    letter-spacing: 0.03em;
    font-family: 'Source Sans 3', sans-serif;
  }
  .tab.active .tab-horario { color: var(--renfe-gold); }

  .tab-dir {
    font-size: 0.58rem;
    color: var(--blue-soft);
    margin-top: 2px;
    font-weight: 400;
    font-family: 'Source Sans 3', sans-serif;
    font-style: italic;
  }

  .tab-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    margin-top: 5px;
    background: var(--border2);
    transition: background 0.2s;
  }
  .tab-dot.done-all  { background: var(--green); }
  .tab-dot.done-some { background: var(--amber); }

  /* ── PANELS ── */
  .panels { flex: 1; overflow: hidden; position: relative; }
  .panel {
    display: none;
    height: 100%;
    overflow-y: auto;
    padding: 16px 14px 82px;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }
  .panel.active { display: block; }

  /* panel heading */
  .panel-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .panel-title span {
    color: var(--renfe-red2);
    font-size: 1rem;
    font-weight: 400;
    display: block;
    margin-bottom: 2px;
    letter-spacing: 0.1em;
  }

  .panel-meta {
    text-align: right;
  }
  .panel-horario {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--renfe-gold);
    letter-spacing: 0.05em;
  }
  .panel-dir {
    font-size: 0.72rem;
    color: var(--blue-soft);
    margin-top: 2px;
    font-style: italic;
  }

  /* ── BLOQUES ── */
  .svc-block { margin-bottom: 14px; }

  .svc-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .svc-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding: 3px 9px;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .badge-train-in  { background: rgba(111,80,180,0.2); color: var(--purple-soft); border: 1px solid rgba(111,80,180,0.5); }
  .badge-train-out { background: rgba(212,160,23,0.15); color: var(--renfe-gold); border: 1px solid rgba(212,160,23,0.4); }
  .badge-bus-in    { background: rgba(111,163,212,0.15); color: var(--blue-soft); border: 1px solid rgba(111,163,212,0.4); }

  .svc-time-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-left: auto;
  }

  .svc-desc {
    font-size: 0.76rem;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 8px;
    line-height: 1.45;
    padding-left: 2px;
  }

  /* ── TAREAS ── */
  .tasks { display: flex; flex-direction: column; gap: 6px; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 3px;
    background: var(--bg3);
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: background 0.15s, opacity 0.2s;
    user-select: none;
    -webkit-user-select: none;
  }
  .task:active { background: #242424; }

  .task.done {
    opacity: 0.32;
    text-decoration: line-through;
    text-decoration-color: var(--muted);
  }

  .task.type-alert  { border-left-color: var(--amber); }
  .task.type-call   { border-left-color: var(--blue-soft); }
  .task.type-action { border-left-color: var(--green); }
  .task.type-wa     { border-left-color: #25d366; }
  .task.done        { border-left-color: var(--border2) !important; }

  .task-check {
    width: 19px; height: 19px;
    border-radius: 2px;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff;
    transition: all 0.15s;
    margin-top: 2px;
  }
  .task.done .task-check { background: var(--green); border-color: var(--green); }

  .task-icon { font-size: 0.95rem; flex-shrink: 0; line-height: 1.65; }
  .task-body { flex: 1; }
  .task-text { font-size: 0.82rem; line-height: 1.5; color: var(--text); }

  /* ── WA BLOCK ── */
  .wa-block {
    margin-top: 7px;
    background: rgba(37,211,102,0.06);
    border: 1px solid rgba(37,211,102,0.18);
    border-radius: 3px;
    padding: 7px 10px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .wa-text { font-size: 0.71rem; color: #6ddc9a; line-height: 1.5; flex: 1; }

  .copy-btn {
    flex-shrink: 0;
    background: rgba(37,211,102,0.12);
    border: 1px solid rgba(37,211,102,0.3);
    border-radius: 2px;
    color: #6ddc9a;
    font-family: 'Oswald', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .copy-btn:active, .copy-btn.copied {
    background: rgba(37,211,102,0.28);
    color: #fff;
  }

  /* ── NOTAS ── */
  .trip-notes {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .trip-notes-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .trip-notes-area {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.82rem;
    padding: 10px 12px;
    resize: none;
    min-height: 76px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  .trip-notes-area:focus { border-color: var(--renfe-gold); }
  .trip-notes-area::placeholder { color: var(--muted); opacity: 0.55; }

  /* ── DIVIDER ── */
  .svc-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  /* ── TAXI CHIPS ── */
  .taxi-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .taxi-chip {
    padding: 3px 10px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    font-size: 0.7rem;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    background: var(--bg);
    transition: all 0.15s;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
  }
  .taxi-chip:active { opacity: 0.7; }
  .taxi-chip.active {
    background: rgba(111,163,212,0.18);
    border-color: var(--blue-soft);
    color: var(--blue-soft);
  }
  .taxi-chip.chip-none { font-style: italic; }
  .taxi-chip.chip-none.active {
    background: rgba(118,118,118,0.12);
    border-color: var(--muted);
    color: var(--renfe-silver);
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 10px 14px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  .nav-btn {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--renfe-silver);
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 2px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .nav-btn:active { background: #2a2a2a; border-color: var(--renfe-red); color: #fff; }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 10px 14px;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .reset-btn:active { border-color: var(--renfe-red); color: var(--renfe-red); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 78px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: #25d366; color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.06em;
    padding: 7px 18px;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
    text-transform: uppercase;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── LOG MODAL ── */
  .log-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 9999;
    padding: 0;
  }
  .log-modal-box {
    background: var(--bg2);
    border-top: 2px solid var(--border2);
    border-radius: 8px 8px 0 0;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    max-height: 80dvh;
  }
  .log-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .log-modal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .log-modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
  }
  .log-modal-area {
    flex: 1;
    background: var(--bg3);
    border: none;
    color: var(--text);
    font-family: 'Source Sans 3', monospace;
    font-size: 0.72rem;
    line-height: 1.6;
    padding: 12px 14px;
    resize: none;
    overflow-y: auto;
    min-height: 0;
  }
  .log-modal-footer {
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .log-download-btn {
    flex: 1;
    background: var(--renfe-red);
    border: none;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 2px;
    cursor: pointer;
  }
  .log-download-btn:active { background: var(--renfe-red2); }
  .log-clear-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 2px;
    cursor: pointer;
  }
  .log-clear-btn:active { background: var(--border); }
  body.day .log-modal { background: rgba(0,0,0,0.5); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="renfe-stripe"></div>
    <div class="header-content">
      <div class="header-left">
        <div class="renfe-logo">Renfe</div>
        <div class="header-station">Betanzos-Infesta</div>
      </div>
      <div class="header-right">
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Modo día/noche">☀️</button>
        <button class="log-btn" onclick="openLog()" title="Ver log del mes">📋</button>
        <div class="clock" id="clock">--:--</div>
      </div>
    </div>
  </div>

let state = {};
let notes = {};
let turnoLog = [];
let currentIdx = 0;

function loadState() {
  try { const s = localStorage.getItem('betanzos_v3'); if(s) state = JSON.parse(s); } catch(e){}
}
function saveState() {
  try { localStorage.setItem('betanzos_v3', JSON.stringify(state)); } catch(e){}
}
function loadNotes() {
  try { const n = localStorage.getItem('betanzos_notes_v1'); if(n) notes = JSON.parse(n); } catch(e){}
}
function loadLog() {
  try { const l = localStorage.getItem('betanzos_log_v1'); if(l) turnoLog = JSON.parse(l); } catch(e){ turnoLog = []; }
}
function saveLog() {
  try { localStorage.setItem('betanzos_log_v1', JSON.stringify(turnoLog)); } catch(e){}
}
function addLogEntry(line) {
  const now = new Date();
  const ts = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
  turnoLog.push('[' + ts + '] ' + line);
  saveLog();
}
function saveNote(tripId, val) {
  if(val.trim()) notes[tripId] = val; else delete notes[tripId];
  try { localStorage.setItem('betanzos_notes_v1', JSON.stringify(notes)); } catch(e){}
}

function allTasksOf(trip) { return trip.blocks.flatMap(b => b.tasks); }
function tripDone(trip) {
  const all = allTasksOf(trip);
  return { done: all.filter(t => state[t.id]).length, total: all.length };
}
function totalTasks() { return TRIPS.reduce((a,t) => a + allTasksOf(t).length, 0); }
function doneTasks()  { return Object.values(state).filter(Boolean).length; }

function badgeClass(b) {
  if(b==='train-in')  return 'badge-train-in';
  if(b==='train-out') return 'badge-train-out';
  return 'badge-bus-in';
}

const TAXI_STATIONS = ['Elviña', 'Burgo', 'Cambre', 'Cecebre'];
const TAXI_ETA = { 'Elviña': 20, 'Burgo': 20, 'Cambre': 15, 'Cecebre': 15 };

function getTaxiState(taskId) {
  const v = state['taxi_' + taskId];
  if(v === 'none') return 'none';
  return Array.isArray(v) ? v : [];
}

function toggleTaxiChip(taskId, station) {
  const cur = getTaxiState(taskId);
  if(station === 'none') {
    state['taxi_' + taskId] = (cur === 'none') ? [] : 'none';
    TAXI_STATIONS.forEach(s => delete state['taxitime_' + taskId + '_' + s]);
  } else {
    const arr = (cur === 'none' || !Array.isArray(cur)) ? [] : [...cur];
    const i = arr.indexOf(station);
    if(i >= 0) {
      arr.splice(i, 1);
      delete state['taxitime_' + taskId + '_' + station];
    } else {
      arr.push(station);
      const now = new Date();
      const arrival = new Date(now.getTime() + (TAXI_ETA[station] || 0) * 60000);
      state['taxitime_' + taskId + '_' + station] =
        String(arrival.getHours()).padStart(2,'0') + ':' + String(arrival.getMinutes()).padStart(2,'0');
    }
    state['taxi_' + taskId] = arr;
  }
  const ns = state['taxi_' + taskId];
  const hasAny = ns === 'none' || (Array.isArray(ns) && ns.length > 0);
  if(hasAny && !state[taskId]) {
    state[taskId] = true;
    const el = document.getElementById('task_' + taskId);
    if(el) {
      el.classList.add('done');
      const chk = el.querySelector('.task-check');
      if(chk) chk.textContent = '✓';
    }
    updateProgress();
    updateTabDot(currentIdx);
  }
  saveState();
  refreshTaxiChips(taskId);
}

function refreshTaxiChips(taskId) {
  const container = document.getElementById('chips_' + taskId);
  if(!container) return;
  const cur = getTaxiState(taskId);
  container.querySelectorAll('.taxi-chip').forEach(chip => {
    const s = chip.dataset.station;
    const isActive = s === 'none' ? cur === 'none' : Array.isArray(cur) && cur.includes(s);
    chip.classList.toggle('active', isActive);
    if(s !== 'none') {
      const eta = isActive ? state['taxitime_' + taskId + '_' + s] : null;
      chip.textContent = eta ? s + ' ≈' + eta : s;
    }
  });
}

function updateProgress() {
  const total = totalTasks(), done = doneTasks();
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${done} / ${total}`;
}

function updateTabDot(idx) {
  const dot = document.getElementById('dot_'+TRIPS[idx].id);
  if(!dot) return;
  const {done, total} = tripDone(TRIPS[idx]);
  dot.className = 'tab-dot' + (done===total && total>0 ? ' done-all' : done>0 ? ' done-some' : '');
}

function toggleTask(taskId) {
  state[taskId] = !state[taskId];
  const waText = document.querySelector('#task_'+taskId+' .wa-text');
  if(waText) {
    if(state[taskId]) {
      const now = new Date();
      const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      state['time_' + taskId] = t;
    } else {
      delete state['time_' + taskId];
    }
  }
  if(state[taskId]) {
    const trip = TRIPS[currentIdx];
    const task = trip && trip.blocks.flatMap(b=>b.tasks).find(t=>t.id===taskId);
    if(task) addLogEntry(trip.viaje + ' | ' + task.icon + ' ' + task.text);
  }
  saveState();
  const el = document.getElementById('task_'+taskId);
  if(el) {
    el.classList.toggle('done', state[taskId]);
    const chk = el.querySelector('.task-check');
    if(chk) chk.textContent = state[taskId] ? '✓' : '';
  }
  if(waText) {
    const base = waText.dataset.base;
    const t = state[taskId] && state['time_' + taskId];
    waText.textContent = '📱 ' + base.replace(/a las \d{2}:\d{2}/, t ? 'a las ' + t : 'a las XX:XX');
  }
  updateProgress();
  updateTabDot(currentIdx);
}

function copyWA(msg, taskId, btn) {
  const time = state['time_' + taskId];
  const fullMsg = msg.replace(/a las \d{2}:\d{2}/, time ? 'a las ' + time : 'a las XX:XX');
  const doFallback = () => {
    const ta = document.createElement('textarea');
    ta.value = fullMsg; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(fullMsg).catch(doFallback);
  } else { doFallback(); }
  btn.textContent = '✓ Copiado';
  btn.classList.add('copied');
  showToast('✓ Copiado');
  setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 2200);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function navigate(dir) {
  const next = currentIdx + dir;
  if(next < 0 || next >= TRIPS.length) return;
  showPanel(next);
}

function showPanel(idx) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  currentIdx = idx;
  document.getElementById('panel_'+TRIPS[idx].id).classList.add('active');
  document.getElementById('tab_'+TRIPS[idx].id).classList.add('active');
  document.getElementById('tab_'+TRIPS[idx].id).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').disabled = (idx === TRIPS.length-1);
}

function resetAll() {
  if(!confirm('¿Reiniciar todo el turno? Se borrarán todas las marcas y notas.')) return;
  addLogEntry('═══ FIN DE TURNO ═══');
  state = {}; saveState();
  notes = {};
  try { localStorage.removeItem('betanzos_notes_v1'); } catch(e){}
  document.querySelectorAll('.task').forEach(el => {
    el.classList.remove('done');
    const chk = el.querySelector('.task-check');
    if(chk) chk.textContent = '';
  });
  document.querySelectorAll('.wa-text').forEach(el => {
    const base = el.dataset.base;
    if(base) el.textContent = '📱 ' + base;
  });
  document.querySelectorAll('.trip-notes-area').forEach(el => { el.value = ''; });
  document.querySelectorAll('.taxi-chip').forEach(el => {
    el.classList.remove('active');
    if(el.dataset.station !== 'none') el.textContent = el.dataset.station;
  });
  checkTurnoInicio();
  TRIPS.forEach((_,i) => updateTabDot(i));
  updateProgress();
}

function render() {
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');

  TRIPS.forEach((trip, idx) => {
    // TAB
    const tab = document.createElement('div');
    tab.className = 'tab' + (idx===0?' active':'');
    tab.id = 'tab_'+trip.id;
    tab.onclick = () => showPanel(idx);
    const opsIcons = trip.blocks.map(b => {
      if(b.badge === 'train-in')  return '🚆↓';
      if(b.badge === 'train-out') return '🚆↑';
      return '🚌';
    }).join(' · ');
    tab.innerHTML = `
      <span class="tab-viaje">${trip.viaje}</span>
      <span class="tab-horario">${trip.horario}</span>
      <span class="tab-dir">${trip.dir}</span>
      <span class="tab-ops">${opsIcons}</span>
      <div class="tab-dot" id="dot_${trip.id}"></div>`;
    tabsEl.appendChild(tab);

    // PANEL
    const panel = document.createElement('div');
    panel.className = 'panel'+(idx===0?' active':'');
    panel.id = 'panel_'+trip.id;

    let html = `
      <div class="panel-heading">
        <div class="panel-title">
          <span>VIAJE</span>${trip.viaje}
        </div>
        <div class="panel-meta">
          <div class="panel-horario">${trip.horario}</div>
          <div class="panel-dir">${trip.dir}</div>
        </div>
      </div>`;

    trip.blocks.forEach((block, bi) => {
      if(bi>0) html += '<hr class="svc-divider">';
      html += `
        <div class="svc-block">
          <div class="svc-label">
            <span class="svc-badge ${badgeClass(block.badge)}">${block.badgeLabel}</span>
            <span class="svc-time-label">${block.timeLabel}</span>
          </div>
          <div class="svc-desc">${block.desc}</div>
          <div class="tasks">`;

      block.tasks.forEach(task => {
        const done = !!state[task.id];
        let waHtml = '';
        if(task.waMsg) {
          const esc = task.waMsg.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          const escBase = task.waMsg.replace(/"/g,'&quot;');
          const storedTime = state['time_' + task.id];
          const displayMsg = done && storedTime
            ? task.waMsg.replace(/a las \d{2}:\d{2}/, 'a las ' + storedTime)
            : task.waMsg.replace(/a las \d{2}:\d{2}/, 'a las XX:XX');
          waHtml = `
            <div class="wa-block" onclick="event.stopPropagation()">
              <span class="wa-text" data-base="${escBase}" data-id="${task.id}">📱 ${displayMsg}</span>
              <button class="copy-btn" onclick="copyWA('${esc}','${task.id}',this)">Copiar</button>
            </div>`;
        }
        let taxiHtml = '';
        if(task.icon === '🚕') {
          const cur = getTaxiState(task.id);
          const chips = TAXI_STATIONS.map(s => {
            const active = Array.isArray(cur) && cur.includes(s);
            const eta = active ? state['taxitime_' + task.id + '_' + s] : null;
            const label = eta ? s + ' ≈' + eta : s;
            return `<span class="taxi-chip${active?' active':''}" data-station="${s}" onclick="event.stopPropagation();toggleTaxiChip('${task.id}','${s}')">${label}</span>`;
          }).join('');
          const noneActive = cur === 'none';
          taxiHtml = `
            <div class="taxi-chips" id="chips_${task.id}" onclick="event.stopPropagation()">
              ${chips}
              <span class="taxi-chip chip-none${noneActive?' active':''}" data-station="none" onclick="event.stopPropagation();toggleTaxiChip('${task.id}','none')">∅ Sin pasajero</span>
            </div>`;
        }
        html += `
          <div class="task type-${task.type}${done?' done':''}" id="task_${task.id}" onclick="toggleTask('${task.id}')">
            <div class="task-check">${done?'✓':''}</div>
            <span class="task-icon">${task.icon}</span>
            <div class="task-body">
              <div class="task-text">${task.text}</div>
              ${waHtml}${taxiHtml}
            </div>
          </div>`;
      });

      html += '</div></div>';
    });

    const escNote = (notes[trip.id] || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    html += `
      <div class="trip-notes">
        <div class="trip-notes-label">📝 Notas del viaje</div>
        <textarea class="trip-notes-area" id="note_${trip.id}"
          placeholder="Incidencias, pasajeros en taxi, observaciones…"
          oninput="saveNote('${trip.id}', this.value)">${escNote}</textarea>
      </div>`;

    panel.innerHTML = html;
    panelsEl.appendChild(panel);
  });

  updateProgress();
  TRIPS.forEach((_,i) => updateTabDot(i));
  document.getElementById('prevBtn').disabled = true;
}

function jumpToNow() {
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const starts = TRIPS.map(t => {
    const [h,m] = t.horario.split(' – ')[0].split(':').map(Number);
    return h*60+m;
  });
  let best = 0;
  starts.forEach((sm,i) => { if(sm <= nowMin) best = i; });
  showPanel(best);
}

function marcarTurnoInicio() {
  state['turno_inicio'] = true;
  saveState();
  document.getElementById('turno-banner').style.display = 'none';
}

function cerrarFinTurnoAlert() {
  state['turno_fin_alert'] = true;
  saveState();
  document.getElementById('turno-fin-alert').style.display = 'none';
}

function checkTurnoInicio() {
  document.getElementById('turno-banner').style.display =
    state['turno_inicio'] ? 'none' : 'flex';
}

function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  document.getElementById('clock').textContent =
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  if(h === 23 && m < 15 && !state['turno_fin_alert']) {
    state['turno_fin_alert'] = true;
    saveState();
    document.getElementById('turno-fin-alert').style.display = 'flex';
  }
}

function openLog() {
  const area = document.getElementById('logArea');
  area.value = turnoLog.length
    ? turnoLog.join('\n')
    : '— Sin registros todavía —';
  document.getElementById('logModal').style.display = 'flex';
}
function closeLog() {
  document.getElementById('logModal').style.display = 'none';
}
function downloadLog() {
  const now = new Date();
  const fname = 'log-turno-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + '.txt';
  const blob = new Blob([turnoLog.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function clearLog() {
  if(!confirm('¿Borrar todo el log del mes?')) return;
  turnoLog = [];
  saveLog();
  document.getElementById('logArea').value = '— Sin registros todavía —';
}

function toggleTheme() {
  const isDay = document.body.classList.toggle('day');
  localStorage.setItem('betanzos_theme', isDay ? 'day' : 'night');
  document.getElementById('themeBtn').textContent = isDay ? '🌙' : '☀️';
}

function loadTheme() {
  const saved = localStorage.getItem('betanzos_theme');
  if(saved === 'day') {
    document.body.classList.add('day');
    document.getElementById('themeBtn').textContent = '🌙';
  }
}

loadState();
loadNotes();
loadLog();
loadTheme();
render();
jumpToNow();
checkTurnoInicio();
updateClock();
setInterval(updateClock, 15000);
</script>
</body>
</html>
